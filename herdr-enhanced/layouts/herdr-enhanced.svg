  <path d="M149 66.5h267" stroke="#2e2e33"/>
  <text x="160" y="59" font-size="11" font-weight="500" fill="#e4e4e8">Pi <tspan font-weight="400" fill="#76767f">~/app</tspan></text>
  <g font-family="ui-monospace,monospace" font-size="10">
    <text x="160" y="88" fill="#76767f">$ <tspan fill="#e4e4e8">pi</tspan></text>
    <text x="160" y="108" fill="#a3a3ad">› Split the parser into two files</text>
    <text x="160" y="128" fill="#e4e4e8">Reading src/parse.js</text>
    <text x="160" y="144" fill="#e4e4e8">Writing src/lexer.js</text>
    <text x="160" y="160" fill="#e4e4e8">Editing src/parse.js</text>
    <text x="160" y="180" fill="#4f8cf7">● Running the tests</text>
  </g>
  <g fill="#26262b"><rect x="160" y="196" width="190" height="6" rx="3"/><rect x="160" y="210" width="150" height="6" rx="3"/><rect x="160" y="224" width="172" height="6" rx="3"/></g>
  <rect x="160" y="344" width="6" height="11" fill="#a3a3ad"/>
  <!-- The panel on Changes: its name and file count first in its top row (History is the tab bar's) -->
  <rect x="424.5" y="43.5" width="208" height="326" rx="9" fill="#141417" stroke="#2e2e33"/>
  <!-- The page, 30 px up: its top row starts at the card's top (no row above it) -->
  <g transform="translate(0 -30)">
  <!-- The page's top row: its name and file count, the scope, the line counts -->
  <text x="436" y="95" font-size="11" font-weight="600" fill="#e4e4e8">Changes</text>
  <rect x="484.5" y="85.5" width="34" height="13" rx="3" fill="none" stroke="#3a3a40"/>
  <text x="501.5" y="95" font-size="8.5" fill="#a3a3ad" text-anchor="middle">2 files</text>
  <rect x="525.5" y="84.5" width="46" height="15" rx="4" fill="none" stroke="#3a3a40"/>
  <text x="530" y="95" font-size="8" fill="#a3a3ad">Uncomm…</text>
  <g font-size="9.5" text-anchor="end"><text x="604" y="95" fill="#3fb950">+12</text><text x="622" y="95" fill="#f85149">−3</text></g>
  <path d="M425 105.5h207" stroke="#2e2e33"/>
  <!-- The files: each with its letter, a Stage button and its line counts -->
  <g font-size="10.5">
    <text x="436" y="124" fill="#e3b341" font-weight="600">M</text><text x="450" y="124" fill="#e4e4e8">src/parse.js</text>
    <text x="436" y="144" fill="#3fb950" font-weight="600">A</text><text x="450" y="144" fill="#e4e4e8">src/lexer.js</text>
  </g>
  <rect x="428" y="111" width="200" height="19" rx="5" fill="#4f8cf7" fill-opacity="0.14"/>
  <g fill="none" stroke="#3a3a40"><rect x="565.5" y="114.5" width="30" height="13" rx="3"/><rect x="565.5" y="134.5" width="30" height="13" rx="3"/></g>
  <g font-size="8.5" fill="#a3a3ad" text-anchor="middle"><text x="580.5" y="124">Stage</text><text x="580.5" y="144">Stage</text></g>
  <g font-size="9" fill="#3fb950" text-anchor="end"><text x="622" y="124">+4</text><text x="622" y="144">+8</text></g>
  <!-- The selected file's diff -->
  <path d="M425 156.5h207" stroke="#2e2e33"/>
  <rect x="425" y="160" width="207" height="15" fill="#26262b"/>
  <text x="436" y="171" font-family="ui-monospace,monospace" font-size="8.5" fill="#76767f">@@ -10,6 +10,7 @@</text>
  <rect x="425" y="211" width="207" height="15" fill="#3fb950" fill-opacity="0.13"/>
  <rect x="425" y="228" width="207" height="15" fill="#3fb950" fill-opacity="0.13"/>
  <rect x="425" y="245" width="207" height="15" fill="#f85149" fill-opacity="0.12"/>
  <g font-family="ui-monospace,monospace" font-size="8.5">
    <g fill="#55555d" text-anchor="end"><text x="446" y="188">10</text><text x="446" y="205">11</text><text x="446" y="222">12</text><text x="446" y="239">13</text><text x="446" y="256">14</text><text x="446" y="273">15</text></g>
    <text x="454" y="188" fill="#a3a3ad">import { lex } from</text>
    <text x="454" y="205" fill="#a3a3ad">export function parse(src) {</text>
    <text x="454" y="222" fill="#3fb950">+  const tokens = lex(src);</text>
    <text x="454" y="239" fill="#3fb950">+  return build(tokens);</text>
    <text x="454" y="256" fill="#f85149">-  return build(scan(src));</text>
    <text x="454" y="273" fill="#a3a3ad">}</text>
    <g fill="#55555d" text-anchor="end"><text x="446" y="290">16</text><text x="446" y="307">17</text></g>
    <text x="454" y="307" fill="#a3a3ad">export { parse };</text>
  </g>
  </g>
  <!-- The commit box at the bottom -->
  <path d="M425 330.5h207" stroke="#2e2e33"/>
  <rect x="432.5" y="338.5" width="122" height="22" rx="5" fill="none" stroke="#3a3a40"/>
  <text x="440" y="353" font-size="9" fill="#55555d">Message</text>
  <rect x="562" y="338" width="62" height="23" rx="5" fill="#4f8cf7"/>
  <text x="593" y="353" font-size="9.5" fill="#ffffff" font-weight="500" text-anchor="middle">Commit</text>
