  <!-- Tab bar: the space's tabs, then the panel's three buttons at the right end: Files, Changes (shown), History -->
  <rect x="148" y="7" width="84" height="22" rx="6" fill="#2c2c31"/>
  <g font-size="11"><text x="168" y="22" fill="#e4e4e8">server</text><text x="262" y="22" fill="#a3a3ad">tests</text></g>
  <g fill="none" stroke="#a3a3ad" stroke-width="1.2"><rect x="155" y="13.5" width="9" height="9" rx="2"/><rect x="248" y="13.5" width="9" height="9" rx="2"/></g>
  <path d="M440 12.5h5l3 3v8h-8z" fill="none" stroke="#a3a3ad" stroke-width="1.3" stroke-linejoin="round"/>
