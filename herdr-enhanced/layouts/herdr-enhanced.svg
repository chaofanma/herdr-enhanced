  <rect x="489" y="7" width="70" height="22" rx="6" fill="#4f8cf7" fill-opacity="0.16"/>
  <circle cx="500" cy="15" r="2" fill="none" stroke="#4f8cf7" stroke-width="1.3"/><circle cx="500" cy="23" r="2" fill="none" stroke="#4f8cf7" stroke-width="1.3"/><path d="M500 17v4" stroke="#4f8cf7" stroke-width="1.3"/>
