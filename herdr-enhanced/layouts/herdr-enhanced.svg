  <circle cx="18" cy="223" r="3.5" fill="#55555d"/>
  <g font-size="10" fill="#76767f" text-anchor="end"><text x="128" y="183">working</text><text x="128" y="205">done</text><text x="128" y="227">idle</text></g>
